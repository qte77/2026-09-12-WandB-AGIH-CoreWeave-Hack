[project]
name = "critique-loop"
version = "1.0.0"
description = "Jev Gate: a critique-refine agent loop fixing Elixir bugs, with TypeSafe-diagnosed escalation and W&B Weave/wandb instrumentation. CoreWeave Hacks: Agent Loops (2026-09-12/13) submission."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "weave>=0.51",
    "wandb>=0.18",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critique_loop"]
